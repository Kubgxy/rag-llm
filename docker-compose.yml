services:
  db:
    image: pgvector/pgvector:pg17
    container_name: ragllm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ragllm
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d ragllm"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
